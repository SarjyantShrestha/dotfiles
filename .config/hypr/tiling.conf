# smart gaps” / “no gaps when only
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]


#application windowrule
windowrulev2 = opacity 1 override 1 override 1 override,class:^(firefox)$
windowrulev2 = opacity 1 override 1 override 1 override,class:^(com\.stremio\.stremio)$
windowrulev2 = opacity 1 override 1 override 1 override,class:^(discord)$
windowrulev2 = opacity 1 override 1 override 1 override,class:^(DBeaver)$
windowrulev2 = workspace 0, class:^(Mattermost)$

#assign workspace 6 to the hdmi
workspace = 6, monitor:HDMI-A-1, default:true

