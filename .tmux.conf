# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."


set -g prefix C-f
set -g mouse on

#removes delay on esc key
set -sg escape-time 0

set -g default-terminal "tmux-256color"

set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'MunifTanjim/tmux-mode-indicator' # Cool AF mode indicator 😉

set -g status-position top
setw -g window-status-current-format "#[bold,fg=green]#I:#W"
setw -g window-status-format "#I:#W"
setw -g window-status-style bg=default
setw -g window-status-current-style bg=default



# set -g status-bg black
# set -g status-fg white

set -g status-bg default
set -g status-left '#[fg=yellow][#S] '
set -g status-style bg=default
set -g status-left-length 30
set -g status-right-length 50
set-option -g status-right '#[fg=yellow]%H:%M | %Y-%m-%d'


set-option -g default-terminal "screen-256color"


setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# Set permanent sessions = on
# set -g @continuum-restore 'on'

# set -g status-right '#{tmux-mode-indicator}'



# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

